<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARM Taller</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#080c18">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        html, body { margin: 0; height: 100%; background: #080c18; color: #94a3b8;
                     font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; text-align: center; }
        a { color: #60a5fa; }
    </style>
    <script>
        // Esta dirección ya no tiene pantalla propia (antes mostraba un login con correo
        // por un instante antes de saltar al correcto). Decide el destino sin pintar nada:
        // con sesión → el sistema; sin sesión → el login por RUT.
        (function () {
            var destino = 'login.html';
            try {
                var raw = sessionStorage.getItem('tll_session') || localStorage.getItem('tll_session');
                var s = raw && JSON.parse(raw);
                if (s && s.id && s.empresa_id && s.rol) destino = 'app.html';
            } catch (e) { /* storage bloqueado: al login */ }
            location.replace(destino + location.hash);
        })();
    </script>
</head>
<body>
    <noscript><p>Para usar ARM Taller activa JavaScript.<br><a href="login.html">Ir al ingreso</a></p></noscript>
</body>
</html>
